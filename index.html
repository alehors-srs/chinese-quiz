  .stat-box { background: #fff; padding: 10px 20px; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); text-align: center; min-width: 100px; }

  #quiz { max-width: 700px; margin: 0 auto; }

  .card.correct { border-color: #27ae60; }
  .card.wrong { border-color: #e74c3c; }
  .char { font-size: 38px; min-width: 80px; text-align: center; color: #2c3e50; }
  .card-body { flex: 1; }
  .card-body input { width: 100%; padding: 10px 14px; font-size: 16px; border: 1px solid #d0d5db; border-radius: 8px; outline: none; transition: border-color 0.2s; }
  .card-body input:focus { border-color: #3498db; }
  .hint { font-size: 13px; color: #95a5a6; margin-top: 6px; display: none; }
  .hint.show { display: block; }
  .hint-link { font-size: 12px; color: #3498db; cursor: pointer; margin-top: 4px; display: inline-block; }
  .actions { display: flex; justify-content: center; gap: 12px; margin: 24px 0; flex-wrap: wrap; }
  button { padding: 12px 28px; font-size: 16px; border: none; border-radius: 10px; cursor: pointer; transition: all 0.2s; }
  #check-btn { background: #3498db; color: #fff; }
  #check-btn:hover { background: #2980b9; }
  #new-btn { background: #2ecc71; color: #fff; }
  #new-btn:hover { background: #27ae60; }
  #result-banner { text-align: center; font-size: 20px; font-weight: bold; margin: 16px 0; min-height: 28px; }
  .score-green { color: #27ae60; }

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function normalize(s) {
  return s.trim().toLowerCase()
    .replace(/ё/g, 'е')
    .replace(/[\s,.!?;:]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

function checkAnswer(user, correct) {
  const u = normalize(user);
  if (!u) return false;
  const variants = correct.split(',').map(v => normalize(v));
  // также учитываем варианты через ";"
  const variants2 = [];
  for (const v of variants) {
    for (const sub of v.split(';')) {
      variants2.push(sub.trim());
    }
  }
  return variants2.some(v => v === u);
}

  selected.forEach((item, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="char">${item.char}</div>
      <div class="card-body">
        <input type="text" placeholder="Перевод на русский…" data-correct="${item.translation.replace(/"/g, '&quot;')}" data-pinyin="${item.pinyin || ''}">
        <span class="hint-link" onclick="toggleHint(this)">показать ответ</span>
        <div class="hint">Пиньинь: ${item.pinyin || '—'} | Перевод: ${item.translation}</div>
      </div>
    `;
    quiz.appendChild(card);
  });
  // Enter -> next field
  const inputs = quiz.querySelectorAll('input');
  inputs.forEach((inp, idx) => {
    inp.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        e.preventDefault();
        if (idx < inputs.length - 1) inputs[idx + 1].focus();
        else document.getElementById('check-btn').click();
      }
    });
  });
}

function toggleHint(link) {
  const hint = link.nextElementSibling;
  hint.classList.toggle('show');
  link.textContent = hint.classList.contains('show') ? 'скрыть ответ' : 'показать ответ';
}

document.getElementById('check-btn').addEventListener('click', () => {
  const cards = document.querySelectorAll('.card');
  let count = 0;
  cards.forEach(card => {
    const input = card.querySelector('input');
    const correct = input.dataset.correct;
    const user = input.value;
    const ok = checkAnswer(user, correct);
    card.classList.remove('correct', 'wrong');
    card.classList.add(ok ? 'correct' : 'wrong');
    if (ok) count++;
  });
  document.getElementById('score').textContent = count + ' / 10';
  if (count > bestScore) bestScore = count;
  document.getElementById('best').textContent = bestScore;
  const banner = document.getElementById('result-banner');
  if (count === 10) {
    banner.textContent = 'Идеально! 10 из 10! 🎉';
    banner.className = 'score-green';
  } else if (count >= 7) {
    banner.textContent = 'Хорошо! ' + count + ' из 10';
    banner.className = 'score-orange';
  } else {
    banner.textContent = 'Нужно больше практики — ' + count + ' из 10';
    banner.className = 'score-red';
  }
});

document.getElementById('new-btn').addEventListener('click', () => {
  roundNum++;
  document.getElementById('round-num').textContent = roundNum;
  renderQuiz();
});

renderQuiz();
</script>
</body>
</html>
